name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (Linux, Python 3.12, pinned analysis environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      # tests/smoke_cellpose.py needs the separate Cellpose environment and a
      # verified weight download; it is run manually, not here.
